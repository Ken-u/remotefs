[metadata]
name = remotefs
version = 0.1.0
description = FUSE-based remote filesystem for AI agents

[options]
packages = find:
install_requires =
    fusepy>=3.0.1
    requests>=2.28.0
    pyyaml>=6.0

[options.packages.find]
include = remotefs*
exclude = tests*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0

[options.entry_points]
console_scripts =
    remotefs = remotefs.cli:main
